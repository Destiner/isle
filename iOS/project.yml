name: IsleMobile
options:
  bundleIdPrefix: DestinerLabs
  deploymentTarget:
    iOS: "26.0"
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
  Robo:
    path: ../Packages/Robo
settings:
  base:
    DEVELOPMENT_TEAM: HQR74263JL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
targets:
  IsleMobile:
    type: application
    platform: iOS
    sources:
      - path: IsleMobile
      - path: ../Shared
        name: Shared
    dependencies:
      - package: MCP
      - package: Robo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: DestinerLabs.IsleMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
    info:
      path: IsleMobile/Info.plist
      properties:
        CFBundleDisplayName: Isle
        NSCalendarsFullAccessUsageDescription: Isle uses your calendar to answer questions and manage events you request.
        NSLocationWhenInUseUsageDescription: Isle uses your location to find nearby places and estimate travel time when you ask.
        NSRemindersFullAccessUsageDescription: Isle uses your reminders to answer questions and manage reminders you request.
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
